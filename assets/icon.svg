  <defs>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset=".35" stop-color="#FFD36B"/>
      <stop offset=".7" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#F0306A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF7A2F" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#F0306A" stop-opacity=".25"/>
      <stop offset="1" stop-color="#F0306A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#100C2A"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 4.6 25.9 10.3V21.7L16 27.4 6.1 21.7V10.3Z" stroke="#9BE8FF" stroke-width="2.1"/>
    <path d="M6.6 10.6 16 16M25.4 10.6 16 16M16 16V26.8" stroke="#4FA3E0" stroke-width="1.6"/>
